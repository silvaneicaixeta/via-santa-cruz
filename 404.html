<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#123C2E">
  <meta name="robots" content="noindex">
  <title>Página não encontrada — Via Santa Cruz</title>
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&family=Playfair+Display:ital,wght@0,500;0,600;0,700&display=swap" rel="stylesheet">
  <style>
    :root{--green:#123C2E;--green2:#0D2E23;--gold:#C8A15A;--ivory:#F7F3EA;--ink:#173027}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--ivory);color:var(--ink);font-family:Lato,Arial,sans-serif}
    main{width:min(92%,780px);text-align:center;padding:48px 24px}
    img{width:150px;height:auto;margin:0 auto 18px}
    .code{font-weight:900;letter-spacing:.22em;color:#9F772F;text-transform:uppercase;font-size:.8rem}
    h1{font-family:"Playfair Display",Georgia,serif;font-size:clamp(2.5rem,8vw,5rem);line-height:1.02;margin:.6rem 0 1rem;font-weight:600}
    p{font-size:1.08rem;max-width:580px;margin:0 auto 1.8rem;color:#53615b}
    a{display:inline-flex;align-items:center;gap:.7rem;background:var(--green);color:white;text-decoration:none;padding:.9rem 1.25rem;border-radius:11px;font-weight:900}
    a:hover{background:var(--green2)}
  </style>
</head>
<body>
  <main>
    <img src="/assets/symbol.svg" alt="">
    <div class="code">Erro 404</div>
    <h1>Este caminho não leva a uma página.</h1>
    <p>O endereço pode ter mudado ou ainda não existir. Volte à página inicial da Via Santa Cruz e continue o caminho por lá.</p>
    <a href="/">Voltar ao início <span aria-hidden="true">→</span></a>
  </main>
</body>
</html>
